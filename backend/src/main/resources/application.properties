spring.application.name=api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:schooldb}
spring.datasource.username=${DB_USER:schooluser}
spring.datasource.password=${DB_PASSWORD:schoolpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.jpa.defer-datasource-initialization=true
spring.dotenv.ignoreIfMissing=true
spring.docker.compose.enabled=false

spring.cache.type=simple
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce=DEBUG
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
