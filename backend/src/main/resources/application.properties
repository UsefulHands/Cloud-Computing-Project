spring.application.name=api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:schooldb}
spring.datasource.username=${DB_USER:schooluser}
spring.datasource.password=${DB_PASSWORD:schoolpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.jpa.defer-datasource-initialization=true
spring.dotenv.ignoreIfMissing=true
spring.docker.compose.enabled=false
